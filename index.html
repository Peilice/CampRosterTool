<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>報名資料轉換</title>
<style>
  /* 積木王國：粗墨線框、硬陰影、紅藍黃綠積木色（設計規格 §3） */
  :root {
    --bg: #fff6d8;
    --dots: rgba(29, 29, 43, .1);
    --surface: #ffffff;
    --text: #1d1d2b;
    --muted: #50556a;
    --ink: #1d1d2b;
    --hard: #1d1d2b;
    --red: #ff6a5c;
    --blue: #5b9bff;
    --yellow: #ffcb2e;
    --green: #3cc47c;
    --on-block: #1d1d2b;
    --accent: #2456d6;
    --accent-soft: #e2ebff;
    --pick: #ffe58a;
    --warn-bg: #fff0b8;
    --warn-text: #5a4200;
    --error-bg: #ffe1dc;
    --error-text: #8a1f1f;
    --ok: #17773f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151e;
      --dots: rgba(255, 255, 255, .07);
      --surface: #1f212d;
      --text: #f1f2f8;
      --muted: #a9adc0;
      --ink: #e9ebf5;
      --hard: #4b5070;
      --red: #ff7d72;
      --blue: #7fb0ff;
      --yellow: #ffd75e;
      --green: #5fd897;
      --on-block: #14151e;
      --accent: #8fb4ff;
      --accent-soft: #263156;
      --pick: #4a3f12;
      --warn-bg: #3b3313;
      --warn-text: #f6dc8f;
      --error-bg: #3d1e1e;
      --error-text: #f2b3b3;
      --ok: #6fe3a1;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dots) 2px, transparent 2.5px);
    background-size: 20px 20px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { display: flex; flex-wrap: wrap; gap: 6px; font-size: 1.5rem; font-weight: 900; margin: 0 0 14px; }
  h1 span {
    display: inline-grid; place-items: center; width: 1.9em; height: 1.9em;
    color: var(--on-block); border: 3px solid var(--ink); border-radius: 8px;
    box-shadow: 3px 3px 0 var(--hard);
  }
  h1 span:nth-child(4n+1) { background: var(--red); transform: rotate(-3deg); }
  h1 span:nth-child(4n+2) { background: var(--yellow); transform: rotate(2deg); }
  h1 span:nth-child(4n+3) { background: var(--blue); transform: rotate(-1deg); }
  h1 span:nth-child(4n+4) { background: var(--green); transform: rotate(3deg); }
  .lead { color: var(--muted); margin: 0 0 24px; }
  section {
    background: var(--surface);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 6px 6px 0 var(--hard);
    padding: 0 20px 20px;
    margin-bottom: 22px;
  }
  #step1 { --band: var(--red); }
  #step2 { --band: var(--blue); }
  #step3 { --band: var(--yellow); }
  section.disabled { opacity: .5; pointer-events: none; }
  h2 {
    font-size: 1.05rem; font-weight: 800;
    margin: 0 -20px 16px; padding: 12px 20px;
    display: flex; align-items: center; gap: 10px;
    background: var(--band); color: var(--on-block);
    border-bottom: 3px solid var(--ink); border-radius: 13px 13px 0 0;
  }
  .step {
    position: relative; flex-shrink: 0;
    display: inline-grid; place-items: center;
    width: 38px; height: 26px; margin-top: 6px; border-radius: 5px;
    background: var(--surface); color: var(--text); border: 3px solid var(--ink);
    font-size: .9rem; font-weight: 900;
  }
  .step::before, .step::after {
    content: ""; position: absolute; top: -9px; width: 11px; height: 7px;
    border: 3px solid var(--ink); border-bottom: 0; border-radius: 4px 4px 0 0;
    background: var(--surface);
  }
  .step::before { left: 4px; }
  .step::after { right: 4px; }
  .drop {
    display: block;
    border: 3px dashed var(--ink);
    border-radius: 14px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: background .15s;
  }
  .drop:hover, .drop.over { background: var(--pick); }
  .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
  .drop input { display: none; }
  .drop svg { display: block; width: 46px; height: 40px; margin: 0 auto 6px; }
  .drop .brick { fill: var(--blue); stroke: var(--ink); stroke-width: 3; }
  .drop strong { display: block; margin-bottom: 4px; font-weight: 800; }
  .drop small { color: var(--muted); }
  .status { margin-top: 12px; font-size: .95rem; }
  .status.ok { color: var(--ok); font-weight: 600; }
  .notice { border: 3px solid var(--ink); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: .92rem; }
  .notice.warn { background: var(--warn-bg); color: var(--warn-text); }
  .notice.error { background: var(--error-bg); color: var(--error-text); }
  .notice.info { background: var(--accent-soft); color: var(--text); }
  .notice ul { margin: 6px 0 0; padding-left: 1.4em; max-height: 12em; overflow-y: auto; }
  .notice details { margin-top: 6px; }
  .notice summary { cursor: pointer; font-size: .85rem; }
  .notice pre {
    margin: 6px 0 0; max-height: 12em; overflow: auto;
    font-size: .8rem; white-space: pre-wrap; word-break: break-all;
  }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  legend { font-weight: 800; margin-bottom: 8px; padding: 0; }
  .options { display: grid; gap: 10px; }
  .options.types { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .options.sessions { grid-template-columns: repeat(3, 1fr); }
  .option {
    display: flex; gap: 10px; align-items: flex-start;
    border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--hard);
    padding: 10px 12px; cursor: pointer; font-weight: 700;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .option:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--hard); }
  .option:has(input:checked) { background: var(--pick); transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--hard); }
  .option input { margin-top: 5px; accent-color: var(--accent); }
  .option span small { display: block; color: var(--muted); font-size: .82rem; font-weight: 400; }
  label.field { display: block; font-weight: 800; margin-bottom: 6px; }
  .name-row { display: flex; align-items: center; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0;
    font: inherit; color: var(--text); background: var(--bg);
    border: 3px solid var(--ink); border-radius: 10px; padding: 8px 12px;
  }
  .ext { color: var(--muted); }
  button {
    font: inherit; font-weight: 800;
    background: var(--yellow); color: var(--on-block);
    border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: 4px 4px 0 var(--hard);
    padding: 10px 24px; margin-top: 18px;
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
  }
  button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--hard); }
  button:disabled { opacity: .5; cursor: wait; transform: none; box-shadow: 4px 4px 0 var(--hard); }
  .option input:focus-visible, input[type=text]:focus-visible, button:focus-visible, ul.files a:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 3px;
  }
  ul.files { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  ul.files a {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 8px 12px; border: 3px solid var(--ink); border-radius: 12px;
    color: var(--text); text-decoration: none; word-break: break-all;
    transition: transform .15s, background .15s;
  }
  ul.files a:hover { background: var(--accent-soft); transform: translateX(3px); }
  ul.files a.zip { font-weight: 800; }
  ul.files a span:last-child {
    flex-shrink: 0; font-weight: 700; font-size: .88rem;
    background: var(--green); color: var(--on-block);
    border: 2px solid var(--ink); border-radius: 6px; padding: 0 10px;
  }
  footer { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 24px; }
  @media (prefers-reduced-motion: reduce) {
    .option, button, ul.files a, .drop { transition: none; }
  }
  @media (max-width: 480px) {
    .options.sessions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1 aria-label="報名資料轉換"><span>報</span><span>名</span><span>資</span><span>料</span><span>轉</span><span>換</span></h1>
  <p class="lead">上傳原始報名 Excel，產生學員整理、狀況總覽、報到資料與編隊檔案。資料只在本機瀏覽器中處理，不會上傳到任何伺服器。</p>

  <section id="step1">
    <h2><span class="step">1</span>選擇原始報名檔</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".xls,.xlsx">
      <svg viewBox="0 0 48 40" aria-hidden="true"><rect class="brick" x="4" y="14" width="40" height="22" rx="4"/><rect class="brick" x="10" y="6" width="10" height="8" rx="2"/><rect class="brick" x="28" y="6" width="10" height="8" rx="2"/></svg>
      <strong>點此選擇檔案，或將檔案拖曳到這裡</strong>
      <small>支援 .xlsx 及網路報名系統匯出的 .xls</small>
    </label>
    <div class="status" id="load-status">程式初始化中（第一次開啟約需 10–30 秒）…</div>
    <div id="load-notices"></div>
  </section>

  <section id="step2" class="disabled">
    <h2><span class="step">2</span>選擇要產生的檔案</h2>
    <fieldset>
      <legend>檔案類型</legend>
      <div class="options types">
        <label class="option"><input type="radio" name="type" value="1" data-name="學員整理" data-ext="xlsx" checked><span>學員整理<small>.xlsx・名單與公告用版面</small></span></label>
        <label class="option"><input type="radio" name="type" value="2" data-name="學員狀況總覽" data-ext="docx"><span>學員狀況總覽<small>.docx・每位學員一張卡片</small></span></label>
        <label class="option"><input type="radio" name="type" value="3" data-name="報到及查詢資料" data-ext="xlsx"><span>報到及查詢資料<small>.xlsx・查詢名單與報到單</small></span></label>
        <label class="option"><input type="radio" name="type" value="4" data-name="編隊" data-ext="xlsx"><span>編隊<small>.xlsx・填編號自動帶出資料</small></span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>梯次</legend>
      <div class="options sessions">
        <label class="option"><input type="radio" name="session" value="1"><span>第一梯</span></label>
        <label class="option"><input type="radio" name="session" value="2"><span>第二梯</span></label>
        <label class="option"><input type="radio" name="session" value="3" checked><span>兩梯都要</span></label>
      </div>
    </fieldset>
    <label class="field" for="name">輸出檔名</label>
    <div class="name-row">
      <input type="text" id="name" value="學員整理">
      <span class="ext" id="ext">.xlsx</span>
    </div>
    <button id="generate">產生檔案</button>
    <div id="gen-notices"></div>
  </section>

  <section id="step3" class="disabled">
    <h2><span class="step">3</span>下載</h2>
    <ul class="files" id="files"><li class="status">尚未產生檔案。</li></ul>
  </section>

  <footer>編號規則、各檔案內容說明請參考專案中的「使用說明.txt」。</footer>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
<script>
  const PY_FILES = [
    "reader.py", "processing.py", "xlsx_style.py",
    "output_a.py", "output_b.py", "output_c.py", "output_d.py",
    "web_entry.py",
  ];
  const MIME = {
    xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    zip: "application/zip",
  };

  const $ = (id) => document.getElementById(id);
  let objectUrls = [];

  function notice(container, kind, text, { items = [], detail = "" } = {}) {
    const div = document.createElement("div");
    div.className = `notice ${kind}`;
    div.append(text);
    if (items.length) {
      const ul = document.createElement("ul");
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = item;
        ul.appendChild(li);
      }
      div.appendChild(ul);
    }
    if (detail) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "顯示技術細節";
      const pre = document.createElement("pre");
      pre.textContent = detail;
      details.append(summary, pre);
      div.appendChild(details);
    }
    container.appendChild(div);
  }

  // 預期外的錯誤只顯示白話說明，原始錯誤收進技術細節（功能規格 §7.4）
  function failure(container, text, err) {
    notice(container, "error", text, { detail: String((err && err.message) || err) });
  }

  const pyReady = (async () => {
    const pyodide = await loadPyodide();
    await pyodide.loadPackage("micropip");
    await pyodide.pyimport("micropip").install(["openpyxl", "python-docx"]);
    pyodide.FS.mkdirTree("/app");
    await Promise.all(PY_FILES.map(async (name) => {
      const res = await fetch(name, { cache: "no-cache" });
      if (!res.ok) throw new Error(`無法載入 ${name}（HTTP ${res.status}）`);
      pyodide.FS.writeFile(`/app/${name}`, await res.text());
    }));
    pyodide.runPython("import sys; sys.path.insert(0, '/app')");
    const entry = pyodide.pyimport("web_entry");
    return { pyodide, entry };
  })();

  pyReady.then(
    () => {
      if (!$("file").files.length) $("load-status").textContent = "程式已就緒，請選擇原始報名檔。";
    },
    (err) => {
      $("load-status").textContent = "";
      failure($("load-notices"), "程式初始化失敗，請確認網路連線正常後重新整理頁面。", err);
    },
  );

  async function loadSource(file) {
    $("load-notices").innerHTML = "";
    $("step2").classList.add("disabled");
    $("load-status").className = "status";
    $("load-status").textContent = `讀取「${file.name}」中…`;
    try {
      const { pyodide, entry } = await pyReady;
      const ext = file.name.toLowerCase().endsWith(".xlsx") ? ".xlsx" : ".xls";
      const path = `/in/source${ext}`;
      pyodide.FS.mkdirTree("/in");
      pyodide.FS.writeFile(path, new Uint8Array(await file.arrayBuffer()));
      const info = JSON.parse(entry.load(path));
      if (info.ok) {
        const counts = Object.entries(info.status_counts).map(([k, n]) => `${k} ${n} 人`);
        $("load-status").textContent =
          `已讀取「${file.name}」：共 ${info.total} 筆原始資料，其中 ${info.included} 筆納入報表` +
          (counts.length ? `（另有${counts.join("、")}）。` : "。");
      } else if (info.total !== undefined) {
        $("load-status").textContent = `已讀取「${file.name}」：共 ${info.total} 筆原始資料。`;
      } else {
        $("load-status").textContent = "";
      }
      if (info.ok) $("load-status").className = "status ok";
      info.messages.forEach((m) => notice($("load-notices"), m.kind, m.text, { items: m.items }));
      if (info.ok) $("step2").classList.remove("disabled");
    } catch (err) {
      $("load-status").textContent = "";
      failure($("load-notices"),
        "無法讀取這個檔案。請確認是報名系統匯出的原始檔，或用 Excel 另存成 .xlsx 後再試一次。", err);
    }
  }

  $("file").addEventListener("change", (e) => {
    if (e.target.files.length) loadSource(e.target.files[0]);
  });
  const drop = $("drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    if (e.dataTransfer.files.length) loadSource(e.dataTransfer.files[0]);
  });

  // 切換檔案類型時，若檔名仍是預設值就跟著換成新類型的名稱
  let lastDefaultName = "學員整理";
  document.querySelectorAll("input[name=type]").forEach((radio) => {
    radio.addEventListener("change", () => {
      const nameInput = $("name");
      if (nameInput.value.trim() === "" || nameInput.value === lastDefaultName) {
        nameInput.value = radio.dataset.name;
      }
      lastDefaultName = radio.dataset.name;
      $("ext").textContent = `.${radio.dataset.ext}`;
    });
  });

  $("generate").addEventListener("click", async () => {
    const typeRadio = document.querySelector("input[name=type]:checked");
    const sessionKey = document.querySelector("input[name=session]:checked").value;
    const baseName = $("name").value.trim() || typeRadio.dataset.name;
    const btn = $("generate");
    $("gen-notices").innerHTML = "";
    btn.disabled = true;
    btn.textContent = "產生中…";
    try {
      const { pyodide, entry } = await pyReady;
      const result = JSON.parse(entry.generate(typeRadio.value, sessionKey, baseName));
      objectUrls.forEach(URL.revokeObjectURL);
      objectUrls = [];
      const list = $("files");
      list.innerHTML = "";
      const paths = result.zip ? [result.zip, ...result.files] : result.files;
      for (const path of paths) {
        const fileName = path.split("/").pop();
        const ext = fileName.split(".").pop();
        const blob = new Blob([pyodide.FS.readFile(path)], { type: MIME[ext] });
        const url = URL.createObjectURL(blob);
        objectUrls.push(url);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        if (path === result.zip) a.className = "zip";
        const label = document.createElement("span");
        label.textContent = path === result.zip ? `全部打包下載（${fileName}）` : fileName;
        const action = document.createElement("span");
        action.textContent = "下載";
        a.append(label, action);
        const li = document.createElement("li");
        li.appendChild(a);
        list.appendChild(li);
      }
      result.notices.forEach((text) => notice($("gen-notices"), "info", text));
      $("step3").classList.remove("disabled");
      $("step3").scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (err) {
      failure($("gen-notices"),
        "產生檔案時發生問題。請重新選擇原始檔後再試一次；若仍然失敗，請展開技術細節回報。", err);
    } finally {
      btn.disabled = false;
      btn.textContent = "產生檔案";
    }
  });
</script>
</body>
</html>
